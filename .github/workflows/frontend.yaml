name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yaml'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start app and wait for it
        run: |
          PORT=3001 npm run start &
          npx wait-on http://localhost:3001
      - run: npx cypress run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
          retention-days: 3

  report:
    runs-on: ubuntu-latest
    needs:
      - build
      - unit
      - e2e

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI Report
        run: |
          mkdir report

          echo "# Frontend CI Report" > report/report.md
          echo "" >> report/report.md
          echo "- Build: SUCCESS" >> report/report.md
          echo "- Unit Tests: SUCCESS" >> report/report.md
          echo "- Cypress E2E: SUCCESS" >> report/report.md
          echo "" >> report/report.md
          echo "Generated on $(date)" >> report/report.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-report
          path: report