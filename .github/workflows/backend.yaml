name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: 'mysql://root:root@localhost:3306/adotapet'
      - run: npm run build

  unit:
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: 'mysql://root:root@localhost:3306/adotapet'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:cov

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: 'mysql://root:root@localhost:3306/test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  report:
    runs-on: ubuntu-latest
    needs:
      - build
      - unit
      - e2e

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI Report
        run: |
          mkdir report

          echo "# Backend CI Report" > report/report.md
          echo "" >> report/report.md
          echo "- Build: SUCCESS" >> report/report.md
          echo "- Unit Tests: SUCCESS" >> report/report.md
          echo "- E2E Tests: SUCCESS" >> report/report.md
          echo "" >> report/report.md
          echo "Generated on $(date)" >> report/report.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-report
          path: report