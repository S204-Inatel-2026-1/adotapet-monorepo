services:
  mysql:
    image: mysql:8
    container_name: adotapet_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: adotapet

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: adotapet_backend
    restart: always

    depends_on:
      - mysql

    environment:
      PORT: 3000
      DATABASE_URL: "mysql://root:root@mysql:3306/adotapet"
      JWT_SECRET: "trocar_em_producao"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3001}"
      PASSWORD_RESET_TOKEN_TTL_MINUTES: "${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"

    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: adotapet_frontend
    restart: always

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
      BACKEND_URL: "http://backend:3000"

    ports:
      - "3001:3000"

volumes:
  mysql_data:
